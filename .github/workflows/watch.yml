name: Зоря — сторож просвіту

on:
  schedule:
    # Смещено с круглых *:00/*:10 и т.д. — на них у GitHub самая высокая
    # нагрузка и старт может ощутимо задерживаться. 7,17,27... — то же
    # самое "раз в 10 минут", но в менее загруженные моменты.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch: # кнопка "Run workflow" в интерфейсе GitHub — для ручного теста
    inputs:
      server:
        description: 'Какой сервер опрашивать'
        type: choice
        default: 'production'
        options:
          - production
          - stand

permissions:
  contents: write # нужно, чтобы коммитить state.json

concurrency:
  group: zoria-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Choose API base
        id: api
        run: |
          if [ "${{ inputs.server }}" = "stand" ]; then
            echo "base=https://stand.zoria.net/api/v1" >> "$GITHUB_OUTPUT"
          else
            echo "base=https://zoria.net/api/v1" >> "$GITHUB_OUTPUT"
          fi

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ZORIA_API_BASE: ${{ steps.api.outputs.base }}
        run: node scripts/watch.mjs

      - name: Commit state if changed
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "zoria-watch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "watch: update state [skip ci]"
            git push
          else
            echo "state.json не изменился, коммитить нечего"
          fi
