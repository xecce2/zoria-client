name: Зоря — сторож просвіту

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {} # кнопка "Run workflow" в интерфейсе GitHub — для ручного теста

permissions:
  contents: write # нужно, чтобы коммитить state.json

concurrency:
  group: zoria-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ZORIA_API_BASE: https://zoria.net/api/v1
        run: node scripts/watch.mjs

      - name: Commit state if changed
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "zoria-watch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "watch: update state [skip ci]"
            git push
          else
            echo "state.json не изменился, коммитить нечего"
          fi
