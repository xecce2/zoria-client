name: Зоря — сторож просвіту

on:
  schedule:
    # Раз в 10 минут, но не на "круглых" минутах (:00, :10, ...): на них у GitHub
    # пик нагрузки, и запуски по расписанию задерживаются или теряются.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch: # кнопка "Run workflow" — ручной запуск для теста
    inputs:
      server:
        description: 'Какой сервер опрашивать'
        type: choice
        default: 'production'
        options:
          - production
          - stand

permissions:
  contents: write # чтобы коммитить state.json

concurrency:
  group: zoria-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # если что-то зависнет — не держать очередь следующих запусков
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Choose API base
        id: api
        run: |
          if [ "${{ inputs.server }}" = "stand" ]; then
            echo "base=https://stand.zoria.net/api/v1" >> "$GITHUB_OUTPUT"
          else
            echo "base=https://zoria.net/api/v1" >> "$GITHUB_OUTPUT"
          fi

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ZORIA_API_BASE: ${{ steps.api.outputs.base }}
        run: node scripts/watch.mjs

      - name: Commit state if changed
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "zoria-watch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "watch: update state [skip ci]"
            # если ты успел что-то запушить во время прогона — сначала подтянуть
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "state.json не изменился, коммитить нечего"
          fi
